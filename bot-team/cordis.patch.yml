# Bot Team bundle patch: the plugin row + the full-capability preset its bots mount.
#
# Presets are ordinary @deepseek-ai/dsh-agent-preset declarations. A bot agent is
# created by the Host half with meta.agentPreset and mounts the preset in its
# setup callback (same mechanism the Web session controller uses).
- insert:
    - id: bot-team
      name: 'dsh-bot-team'
      config:
        # Empty ⇒ $DSH_HOME/dsh-bot-team (plugin data root).
        dataDir: ''
        # Empty ⇒ <dataDir>/bots (BOT.md persona files).
        botsDir: ''
        # Legacy fallback only: new groups default to <dataDir>/groups/<groupId>,
        # direct chats to <dataDir>/direct/<botId>. Empty ⇒ the Host process cwd.
        defaultCwd: ''
        maxParallelTurns: 3
        maxContextMessages: 40
        turnTimeoutMs: 300000
        # M1 verification finished: stop writing demo/smoke data on activation.
        # Flip back to true only when re-running the end-to-end smoke checks.
        smokeTest: false
        # M4 hardening defaults
        botSandbox: true
        # ask: surface approval requests in the group and answer in the bot session.
        # never: deterministic headless deny (unattended/CI).
        botApprovalPolicy: ask
        # PDF export discovers a system CJK TrueType font. Set pdfFontPath to
        # override it with an explicit .ttf/.ttc file.
        pdfFontPath: ''
        maxTurnsPerHour: 120
        dailyTokenBudget: 5000000
        # smokeResultsDir is intentionally unset: it defaults to <cwd>/.bot-team.
        # Set it per profile only when re-running the smoke checks.

    - id: preset-bot-team-tools
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: bot-team-tools
        name: 'Bot Team · 全能'
        description: 'Bot Team bot：文件读写、搜索、联网、命令执行、Skill，workspace-write 沙箱。'
        order: 40
        plugins:
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          # The skill registry itself is host-plane (dsh-base); the preset owns
          # local discovery and the model-facing catalog/loader. Both are needed
          # so a user-picked /skill-name gesture resolves inside a bot turn.
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
